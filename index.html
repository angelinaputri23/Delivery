<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Delivery Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
:root{--bg:#fff;--fg:#1f2430;--m:#6b7280;--card:#f6f7f9;--bd:#dfe3e8;--ac:#1a7f5a;--acf:#fff;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#16181d;--fg:#e8eaee;--m:#9aa1ac;--card:#1f232a;--bd:#323843;--ac:#3fbf8f;--acf:#08150f;color-scheme:dark}}
:root[data-theme=dark]{--bg:#16181d;--fg:#e8eaee;--m:#9aa1ac;--card:#1f232a;--bd:#323843;--ac:#3fbf8f;--acf:#08150f;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 12px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
button,input,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;max-width:100%}
button{cursor:pointer}button.p,nav button.on{background:var(--ac);color:var(--acf);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.m{color:var(--m)}.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
.pill{padding:1px 10px;border-radius:99px;border:1px solid var(--bd);font-size:12px}
.pill.Prepared{color:#b45309}.pill.Shipped{color:#2563eb}.pill.Delivered{color:var(--ac)}
ul{margin:6px 0;padding-left:20px}
</style></head><body><main>
<h1>📦 Delivery Dashboard</h1>
<nav><button data-t="dash" onclick="go('dash')">Ringkasan</button><button data-t="req" onclick="go('req')">Permintaan barang</button><button data-t="ship" onclick="go('ship')">Pengiriman</button>
<span style="flex:1"></span><button onclick="bk()">⬇ Backup</button><button onclick="document.getElementById('imp').click()">⬆ Restore</button><input id="imp" type="file" accept=".json" hidden onchange="rs(this)"></nav>
<div id="v"></div></main>
<script>
const BR={TN:['TN 台南科工一','No. 42, Keji 2nd Rd., Annan Dist., Tainan City 709033, Taiwan'],FN:['FN 湖內','No. 2, Changchun 4th St., Hunei Dist., Kaohsiung City 829'],MF:['MF 明湖','No. 33, Ln. 486, Minghu Rd., East Dist., Hsinchu City 300'],DW:['DW 德威','No. 3, Fuqun St., Xiangshan Dist., Hsinchu City 300'],DT:['DT 大學','No. 338, Daxue 7th St., Nanzi Dist., Kaohsiung City 811']};
const CR=['HCT','Maple','Hemao'],STS=['Requested','Prepared','Shipped','Delivered'];
let S={reqs:[],ships:[]},tab='dash',sel=new Set(),fb='',fs='';
try{S=JSON.parse(localStorage.getItem('dlv')||'')||S}catch(e){}
const save=()=>{try{localStorage.setItem('dlv',JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bopt=v=>Object.keys(BR).map(k=>`<option value="${k}"${k==v?' selected':''}>${BR[k][0]}</option>`).join('');
const shipOf=r=>S.ships.find(x=>x.id==r.shipId),st=r=>shipOf(r)?shipOf(r).status:'Requested',items=id=>S.reqs.filter(r=>r.shipId==id);
function go(t){tab=t;render()}
function render(){document.querySelectorAll('nav button[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));$('#v').innerHTML=tab=='dash'?vDash():tab=='req'?vReq():vShip()}
function vDash(){
 const rows=Object.keys(BR).map(k=>{const rs=S.reqs.filter(r=>r.branch==k);return `<tr><td>${BR[k][0]}</td>${STS.map(s=>`<td>${rs.filter(r=>st(r)==s).length}</td>`).join('')}</tr>`}).join('');
 const tr=S.ships.filter(s=>s.status=='Shipped').map(s=>`<li><b>${BR[s.branch][0]}</b> · ${esc(s.carrier||'-')} · ${esc(s.code||'(belum ada kode)')} · ${s.date}</li>`).join('')||'<li class="m">Tidak ada paket dalam perjalanan</li>';
 const pr=S.ships.filter(s=>s.status=='Prepared').length;
 return `<div class="card"><b>Jumlah item per cabang (per status)</b><div class="sc"><table><tr><th>Cabang<th>Requested<th>Prepared<th>Shipped<th>Delivered</tr>${rows}</table></div></div>
 <div class="card"><b>Sedang dikirim (Shipped)</b><ul>${tr}</ul><div class="m">${pr} pengiriman berstatus Prepared (belum dikirim)</div></div>`}
function vReq(){
 const rs=S.reqs.filter(r=>(!fb||r.branch==fb)&&(!fs||st(r)==fs)).sort((a,b)=>b.date.localeCompare(a.date));
 return `<div class="card"><b>Tambah permintaan</b><div class="row"><input type="date" id="nd" value="${today()}"><select id="nb">${bopt()}</select>
 <input id="ni" placeholder="Barang (mis. Uniform)" list="il"><input id="nq" placeholder="Qty" size="8"><input id="nn" placeholder="Catatan (nama, ukuran…)"><button class="p" onclick="addReq()">Tambah</button></div>
 <datalist id="il">${[...new Set(S.reqs.map(r=>r.item))].map(i=>`<option value="${esc(i)}">`).join('')}</datalist></div>
 <div class="row"><select onchange="fb=this.value;render()"><option value="">Semua cabang</option>${bopt(fb)}</select>
 <select onchange="fs=this.value;render()"><option value="">Semua status</option>${STS.map(s=>`<option${s==fs?' selected':''}>${s}</option>`).join('')}</select>
 <button class="p" onclick="mkShip()">Siapkan pengiriman dari yang dicentang</button></div>
 <div class="sc"><table><tr><th><th>Tgl<th>Cabang<th>Barang<th>Qty<th>Catatan<th>Status<th></tr>${rs.map(r=>`<tr><td>${st(r)=='Requested'?`<input type="checkbox" ${sel.has(r.id)?'checked':''} onchange="tg('${r.id}')">`:''}<td>${r.date}<td>${r.branch}<td>${esc(r.item)}<td>${esc(r.qty)}<td>${esc(r.note)}<td><span class="pill ${st(r)}">${st(r)}</span><td><button onclick="del('${r.id}')">✕</button></tr>`).join('')||'<tr><td colspan="8" class="m">Belum ada data</td></tr>'}</table></div>`}
function vShip(){
 return S.ships.slice().reverse().map(s=>`<div class="card"><div class="row"><b>${BR[s.branch][0]}</b><span class="m">${s.date}</span><span class="pill ${s.status}">${s.status}</span></div>
 <ul>${items(s.id).map(r=>`<li>${esc(r.item)} × ${esc(r.qty)}${r.note?` <span class="m">(${esc(r.note)})</span>`:''}</li>`).join('')}</ul>
 <div class="row"><select onchange="up('${s.id}','status',this.value,1)">${STS.slice(1).map(x=>`<option${x==s.status?' selected':''}>${x}</option>`).join('')}</select>
 <select onchange="up('${s.id}','carrier',this.value)"><option value="">Kurir…</option>${CR.map(c=>`<option${c==s.carrier?' selected':''}>${c}</option>`).join('')}</select>
 <input placeholder="Kode tracking" value="${esc(s.code)}" onchange="up('${s.id}','code',this.value.trim())">
 <label class="m">Tgl terkirim <input type="date" value="${s.deliv||''}" onchange="up('${s.id}','deliv',this.value)"></label></div>
 <div class="row"><button class="p" onclick="nota('${s.id}')">Unduh nota (.xlsx)</button><button onclick="unship('${s.id}')">Batalkan pengiriman</button></div></div>`).join('')||'<p class="m">Belum ada pengiriman. Centang item di tab Permintaan lalu klik “Siapkan pengiriman”.</p>'}
function addReq(){const item=$('#ni').value.trim();if(!item)return;S.reqs.push({id:uid(),date:$('#nd').value||today(),branch:$('#nb').value,item,qty:$('#nq').value.trim()||'1',note:$('#nn').value.trim()});save();render()}
function tg(id){sel.has(id)?sel.delete(id):sel.add(id)}
function del(id){if(!confirm('Hapus item ini?'))return;S.reqs=S.reqs.filter(r=>r.id!=id);sel.delete(id);save();render()}
function mkShip(){const rs=S.reqs.filter(r=>sel.has(r.id));if(!rs.length)return alert('Centang item dulu.');if(new Set(rs.map(r=>r.branch)).size>1)return alert('Satu pengiriman = satu cabang.');
 const id=uid();S.ships.push({id,date:today(),branch:rs[0].branch,status:'Prepared',carrier:'',code:'',deliv:''});rs.forEach(r=>r.shipId=id);sel.clear();save();go('ship')}
function up(id,k,v,re){const s=S.ships.find(x=>x.id==id);s[k]=v;if(k=='status'&&v=='Delivered'&&!s.deliv)s.deliv=today();save();if(re)render()}
function unship(id){if(!confirm('Batalkan pengiriman? Item kembali ke Requested.'))return;items(id).forEach(r=>delete r.shipId);S.ships=S.ships.filter(s=>s.id!=id);save();render()}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click()}
function bk(){dl(new Blob([JSON.stringify(S)],{type:'application/json'}),'delivery-backup-'+today()+'.json')}
function rs(el){const f=el.files[0];if(!f)return;f.text().then(t=>{try{S=JSON.parse(t);save();render()}catch(e){alert('File tidak valid')}})}
async function nota(id){
 const s=S.ships.find(x=>x.id==id),b=BR[s.branch],its=items(id),wb=new ExcelJS.Workbook(),ws=wb.addWorksheet(s.date.replace(/-/g,''));
 [6,10,10,10,10,18,24].forEach((w,i)=>ws.getColumn(i+1).width=w);
 const F=(z,b)=>({name:'Microsoft JhengHei',size:z,bold:!!b}),put=(r,v,z,bd,al)=>{ws.mergeCells(r,1,r,7);const c=ws.getCell(r,1);c.value=v;c.font=F(z,bd);c.alignment={horizontal:al||'center',vertical:'middle'}};
 const [y,m,d]=s.date.split('-');
 put(1,'XMART 艾克市股份有限公司',18,1);put(2,'地址 : 台北市信義區忠孝東路五段508號9樓之2',12);put(3,'電話 : 02- 2727-5880 / 5881',12);put(5,'出貨單',18,1);
 put(8,`${y}年 ${+m}月 ${+d}日`,12,1);put(9,'店名：'+b[0],12,0,'left');put(10,'地址： '+b[1],12,0,'left');
 const hd=(r,c1,c2,v)=>{if(c2>c1)ws.mergeCells(r,c1,r,c2);const c=ws.getCell(r,c1);c.value=v;c.font=F(12,1);c.alignment={horizontal:'center',vertical:'middle'}};
 hd(12,1,5,'商品名稱 (Product Name)');hd(12,6,6,'數量 (Quantity)');hd(12,7,7,'備註 (Notes)');
 let r=13;
 its.forEach(i=>{ws.mergeCells(r,1,r,5);const a=ws.getCell(r,1);a.value=i.item;a.font=F(12);const q=ws.getCell(r,6),n=Number(i.qty);q.value=i.qty!==''&&!isNaN(n)?n:i.qty;q.font=F(12);q.alignment={horizontal:'center'};const t=ws.getCell(r,7);t.value=i.note||null;t.font=F(12);t.alignment={wrapText:true};r++});
 const e=r+5;ws.mergeCells(r,1,e,1);const a=ws.getCell(r,1);a.value='收\n件\n人\n簽\n章';a.font=F(12);a.alignment={horizontal:'center',vertical:'middle',wrapText:true};
 const bx=(r1,c1,r2,c2,v)=>{ws.mergeCells(r1,c1,r2,c2);const c=ws.getCell(r1,c1);c.value=v;c.font=F(12);c.alignment={vertical:'top',wrapText:true}};
 bx(r,2,e,4,'簽名 (Signature): ');bx(r,5,r+1,7,"收件人姓名 (Recipient's Name):");bx(r+2,5,r+3,7,'出貨日期 (Shipment Date): '+s.date.replace(/-/g,'/'));bx(r+4,5,e,7,'收款日期 (Date of Receipt): ');
 const th={style:'thin'};for(let i=12;i<=e;i++)for(let j=1;j<=7;j++)ws.getCell(i,j).border={top:th,left:th,bottom:th,right:th};
 ws.pageSetup={paperSize:9,fitToPage:true,fitToWidth:1,fitToHeight:0};
 dl(new Blob([await wb.xlsx.writeBuffer()],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),`Delivery ${b[0].split(' ')[0]} - ${s.date}.xlsx`)}
render();
</script></body></html>
